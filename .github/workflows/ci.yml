name: test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: 8
            distribution: zulu
            jobtype: 1
          - java: 8
            distribution: zulu
            jobtype: 2
          - java: 8
            distribution: zulu
            jobtype: 3
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner
      uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
      with:
        use-policy-store: true
        egress-policy: audit
        api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-java@v4
      with:
        distribution: "${{ matrix.distribution }}"
        java-version: "${{ matrix.java }}"
        cache: sbt
    - uses: sbt/setup-sbt@v1
    - name: Build and test (sbt 1.x)
      if: ${{ matrix.jobtype == 1 }}
      shell: bash
      run: |
        sbt --client +test
        sbt --client "++2.12.x; scripted"
    - name: Build and test (sbt 2.x)
      if: ${{ matrix.jobtype == 2 }}
      shell: bash
      run: |
        sbt --client "++3.x; scripted"
    - name: Mima
      if: ${{ matrix.jobtype == 3 }}
      shell: bash
      run: |
        sbt --client mimaReportBinaryIssues
